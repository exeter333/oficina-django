<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tarefas{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    .done { text-decoration: line-through; color: #888; }
    form.inline { display: inline; margin: 0; }
    input[type=text] { padding: 6px; width: 70%; }
    button, .btn { padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📝 Minhas Tarefas</h1>
  {% block content %}{% endblock %}
</body>
</html>
